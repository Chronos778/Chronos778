<svg height="500" viewbox="0 0 660 500" width="660" xmlns="http://www.w3.org/2000/svg">
<style>
        .text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #abb2bf; }
        .prompt-user { fill: #98c379; font-weight: bold; }
        .prompt-colon { fill: #abb2bf; }
        .prompt-tilde { fill: #61afef; font-weight: bold; }
        .prompt-dollar { fill: #abb2bf; }
        .cmd { fill: #56b6c2; font-weight: bold; }
        .arg { fill: #e06c75; }
        .string { fill: #98c379; }
        .key { fill: #e06c75; }
        .icon { fill: #c678dd; }
    
        @keyframes wipeText { 0% { clip-path: inset(0 100% 0 0); opacity: 0; } 1% { opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 1; } }
</style>
<defs>
<filter height="110%" id="shadow" width="110%" x="-5%" y="-5%">
<fedropshadow dx="0" dy="15" flood-color="#000000" flood-opacity="0.5" stddeviation="20"></fedropshadow>
</filter>
</defs>
<!-- Main Window Background -->
<rect fill="#1e1e1e" filter="url(#shadow)" height="460" rx="10" width="620" x="20" y="20"></rect>
<!-- Title Bar -->
<path d="M 20 30 Q 20 20 30 20 L 630 20 Q 640 20 640 30 L 640 50 L 20 50 Z" fill="#2d2d2d"></path>
<!-- Window Controls (Arch Linux style) -->
<!-- Title Text -->
<text fill="#8b8b8b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" x="330" y="39">maithil@archlinux: ~</text>
<!-- Terminal Content -->
<g class="text">
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 0.0s" x="40" y="85">
<tspan class="prompt-user">maithil@archlinux</tspan><tspan class="prompt-colon">:</tspan><tspan class="prompt-tilde">~</tspan><tspan class="prompt-dollar">$</tspan>
<tspan xml:space="preserve"> </tspan><tspan class="cmd">whoami</tspan>
</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 0.15s" x="40" y="110">Maithil — Aspiring Data Scientist, Problem Solver &amp; Tech Enthusiast</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 0.3s" x="40" y="130">Location: Earth</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 0.44999999999999996s" x="40" y="170">
<tspan class="prompt-user">maithil@archlinux</tspan><tspan class="prompt-colon">:</tspan><tspan class="prompt-tilde">~</tspan><tspan class="prompt-dollar">$</tspan>
<tspan xml:space="preserve"> </tspan><tspan class="cmd">cat</tspan> <tspan class="arg">skills.json</tspan>
</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 0.6s" x="40" y="195">{</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 0.75s" x="60" y="215"><tspan class="key">"languages"</tspan>: [<tspan class="string">"JavaScript"</tspan>, <tspan class="string">"Python"</tspan>, <tspan class="string">"Java"</tspan>, <tspan class="string">"C/C++"</tspan>],</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 0.8999999999999999s" x="60" y="235"><tspan class="key">"frontend"</tspan>:  [<tspan class="string">"React"</tspan>, <tspan class="string">"Next.js"</tspan>],</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 1.05s" x="60" y="255"><tspan class="key">"backend"</tspan>:   [<tspan class="string">"Node.js"</tspan>, <tspan class="string">"FastAPI"</tspan>, <tspan class="string">"Python"</tspan>],</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 1.2s" x="60" y="275"><tspan class="key">"databases"</tspan>: [<tspan class="string">"PostgreSQL"</tspan>, <tspan class="string">"MySQL"</tspan>, <tspan class="string">"SQLite3"</tspan>],</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 1.3499999999999999s" x="60" y="295"><tspan class="key">"tools"</tspan>:     [<tspan class="string">"Git"</tspan>, <tspan class="string">"GitHub"</tspan>, <tspan class="string">"Linux"</tspan>, <tspan class="string">"VS Code"</tspan>]</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 1.5s" x="40" y="315">}</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 1.65s" x="40" y="355">
<tspan class="prompt-user">maithil@archlinux</tspan><tspan class="prompt-colon">:</tspan><tspan class="prompt-tilde">~</tspan><tspan class="prompt-dollar">$</tspan>
<tspan xml:space="preserve"> </tspan><tspan class="cmd">./status.sh</tspan>
</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 1.7999999999999998s" x="40" y="380"><tspan class="icon">▶</tspan> Currently Learning: AI/ML</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 1.95s" x="40" y="405"><tspan class="icon">▶</tspan> Goals:</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 2.1s" x="60" y="425">- Build scalable applications</text>
<text style="opacity: 0; animation: wipeText 0.4s ease-out forwards; animation-delay: 2.25s" x="60" y="445">- Contribute to open source</text>
</g>
</svg>
